<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADMIN QURBAN SUNNAH</title>
<link rel="manifest" href="admin-manifest.json"><meta name="theme-color" content="#14513a"><link rel="icon" href="admin-192.png"><link rel="apple-touch-icon" href="admin-192.png">
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2a22;--mu:#66736b;--pr:#1f7a4d;--pr2:#e3f2ea;--bd:#e1ddd0;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mu:#9aa89f;--pr:#4cc388;--pr2:#1f3a2c;--bd:#2c3a32;--rd:#ff8a80}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mu:#9aa89f;--pr:#4cc388;--pr2:#1f3a2c;--bd:#2c3a32;--rd:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
button{padding:9px 13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--pr2);color:var(--pr)}button.d{background:transparent;color:var(--rd);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.bar{height:8px;background:var(--pr2);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
.big{font-size:28px;font-weight:700;color:var(--pr)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:var(--pr2);color:var(--pr)}.tabs button.on{background:var(--pr);color:#fff}
.err{color:var(--rd);font-size:13px;min-height:18px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}
</style>
</head>
<body>
<div id="app"></div>
<script id="pt" type="application/json">"\u003c!doctype html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>PESERTA QURBAN SUNNAH\u003c/title>\n\u003clink rel=\"manifest\" href=\"manifest.json\">\u003cmeta name=\"theme-color\" content=\"#1f7a4d\">\u003clink rel=\"icon\" href=\"icon-192.png\">\u003clink rel=\"apple-touch-icon\" href=\"icon-192.png\">\n\u003cstyle>\n:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2a22;--mu:#66736b;--pr:#1f7a4d;--pr2:#e3f2ea;--bd:#e1ddd0;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mu:#9aa89f;--pr:#4cc388;--pr2:#1f3a2c;--bd:#2c3a32;--rd:#ff8a80}}\n:root[data-theme=\"dark\"]{--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mu:#9aa89f;--pr:#4cc388;--pr2:#1f3a2c;--bd:#2c3a32;--rd:#ff8a80}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n#app{max-width:520px;margin:0 auto;padding:14px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}\nh1{font-size:20px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}\n.mu{color:var(--mu);font-size:13px}\ninput{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}\nbutton{padding:10px 14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%}\nbutton.s{background:var(--pr2);color:var(--pr)}\n.bar{height:8px;background:var(--pr2);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}\n.big{font-size:30px;font-weight:700;color:var(--pr)}\n.it{padding:10px 0;border-top:1px solid var(--bd)}.it:first-child{border-top:0}\n.err{color:var(--rd);font-size:13px;min-height:18px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cscript id=\"seed\" type=\"application/json\">{\"updated\":0,\"members\":[]}\u003c/script>\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');\nconst fd=d=>{const[y,m,t]=String(d).split('-');return t?`${t}/${m}/${y}`:d};\nlet S=JSON.parse($('#seed').textContent);\nconst saldo=m=>m.trx.reduce((a,t)=>a+t.j,0);\nconst upd=()=>S.updated?new Date(S.updated).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'}):'-';\nlet me=null,msg='';\nfunction render(){\n  const a=$('#app');\n  if(!me){\n    a.innerHTML=`\u003cdiv class=\"card\">\u003ch1>🐑 PESERTA QURBAN SUNNAH\u003c/h1>\u003cdiv class=\"mu\">Masukkan nama Anda untuk melihat saldo\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003clabel class=\"mu\">Nama Peserta\u003c/label>\u003cinput id=\"nm\" placeholder=\"Ketik nama sesuai daftar\" autocomplete=\"off\" onkeydown=\"if(event.key=='Enter')go()\">\u003cbutton onclick=\"go()\">Masuk\u003c/button>\u003cdiv class=\"err\">${esc(msg)}\u003c/div>\u003cdiv class=\"mu\" style=\"text-align:center\">🕒 Data terakhir diperbarui admin: ${upd()}\u003c/div>\u003c/div>`;\n    return;\n  }\n  const m=me,s=saldo(m),p=m.target>0?Math.min(100,s/m.target*100):0;\n  a.innerHTML=`\u003cdiv class=\"card\">\u003ch1>${esc(m.nama)}\u003c/h1>\u003cdiv class=\"mu\">PESERTA QURBAN SUNNAH\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"mu\">Saldo Anda\u003c/div>\u003cdiv class=\"big\">${rp(s)}\u003c/div>\n  ${m.target>0?`\u003cdiv class=\"bar\">\u003ci style=\"width:${p}%\">\u003c/i>\u003c/div>\u003cdiv class=\"mu\">${p.toFixed(0)}% dari target ${rp(m.target)} · kurang ${rp(Math.max(0,m.target-s))}\u003c/div>`:''}\u003c/div>\n  \u003cdiv class=\"card\">\u003ch2>Riwayat Transaksi\u003c/h2>${m.trx.length?[...m.trx].sort((x,y)=>y.d.localeCompare(x.d)).map(t=>`\u003cdiv class=\"it\">\u003cb style=\"color:${t.j\u003c0?'var(--rd)':'var(--pr)'}\">${t.j\u003c0?'Debit − ':'Kredit + '}${rp(Math.abs(t.j))}\u003c/b>\u003cdiv class=\"mu\">${fd(t.d)}${t.n?' · '+esc(t.n):''}\u003c/div>\u003c/div>`).join(''):'\u003cdiv class=\"mu\">Belum ada transaksi.\u003c/div>'}\u003c/div>\n  \u003cbutton class=\"s\" onclick=\"me=null;msg='';render()\">Keluar\u003c/button>\n  \u003cdiv class=\"mu\" style=\"text-align:center;margin-top:10px\">🕒 Data terakhir diperbarui admin:\u003cbr>${upd()}\u003c/div>`;\n}\nfunction go(){const v=$('#nm').value.trim().toLowerCase().replace(/\\s+/g,' ');\n  const m=S.members.find(x=>x.nama.trim().toLowerCase().replace(/\\s+/g,' ')==v);\n  if(!m){msg='Nama tidak ditemukan. Hubungi pengurus.';return render()}me=m;msg='';render()}\nrender();\nfetch('data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.members)&&d.members.length&&(d.updated||0)>=S.updated){S=d;if(!me)render()}}).catch(()=>{});\nif('serviceWorker' in navigator)navigator.serviceWorker.register('admin-sw.js').catch(()=>{});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script id="seed" type="application/json">{"updated":0,"members":[]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const fd=d=>{const[y,m,t]=String(d).split('-');return t?`${t}/${m}/${y}`:d};
const saldo=m=>m.trx.reduce((a,t)=>a+t.j,0);
const today=()=>new Date().toISOString().slice(0,10);
const pct=m=>m.target>0?Math.min(100,saldo(m)/m.target*100):0;
const uid=()=>Math.random().toString(36).slice(2,9);
let S=JSON.parse($('#seed').textContent);
const seedUpdated=S.updated;
try{const d=JSON.parse(localStorage.getItem('qurban-draft')||'null');if(d&&d.updated>S.updated)S=d}catch(e){}
let role=null,me=null,sel=null,tab='a',msg='';
const dirty=()=>S.updated>seedUpdated;
function save(){S.updated=Date.now();try{localStorage.setItem('qurban-draft',JSON.stringify(S))}catch(e){}}

function render(){
  const a=$('#app');
  if(!role){
    a.innerHTML=`<div class="card"><h1>🐑 ADMIN QURBAN SUNNAH</h1><div class="mu">Panel Admin — khusus pengurus, jangan dibagikan</div></div>
    <div class="card"><div class="tabs"><button class="${tab=='a'?'on':''}" onclick="tab='a';msg='';render()">Admin</button></div>
    ${tab=='p'?`<label class="mu">Nama Anda</label><input id="nm" placeholder="Ketik nama sesuai daftar" onkeydown="if(event.key=='Enter')loginP()"><button onclick="loginP()">Lihat Saldo</button>`
    :`<label class="mu">${S.pin?'PIN Admin':'Buat PIN baru (min. 4 angka)'}</label><input id="pn" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key=='Enter')loginA()"><button onclick="loginA()">Masuk</button>`}
    <div class="err">${esc(msg)}</div></div>`;
    return;
  }
  if(role=='p')return renderP(a);
  renderA(a);
}
function loginP(){const v=$('#nm').value.trim().toLowerCase();const m=S.members.find(x=>x.nama.trim().toLowerCase()==v);
  if(!m){msg='Nama tidak ditemukan. Hubungi admin.';return render()}me=m.id;role='p';msg='';render()}
function loginA(){const v=$('#pn').value;if(!S.pin){if(v.length<4){msg='Minimal 4 angka';return render()}S.pin=v;save();role='a';msg='';render();if(!S.members.length)fromPeserta();return}if(v==S.pin){role='a';msg='';render();if(!S.members.length)fromPeserta()}else{msg='PIN salah';render()}}
function out(){role=null;me=null;sel=null;msg='';render()}

function renderP(a){
  const m=S.members.find(x=>x.id==me);if(!m)return out();
  a.innerHTML=`<div class="card"><div class="row" style="align-items:center"><div><h1>${esc(m.nama)}</h1><div class="mu">Tabungan Qurban Sunnah</div></div><button class="s" style="flex:0" onclick="out()">Keluar</button></div></div>
  <div class="card"><div class="mu">Saldo Anda</div><div class="big">${rp(saldo(m))}</div>
  ${m.target>0?`<div class="bar"><i style="width:${pct(m)}%"></i></div><div class="mu">${pct(m).toFixed(0)}% dari target ${rp(m.target)} · kurang ${rp(Math.max(0,m.target-saldo(m)))}</div>`:''}</div>
  <div class="card"><h2>Riwayat Setoran</h2>${hist(m,false)}</div>
  <div class="mu" style="text-align:center">Data per ${S.updated?new Date(S.updated).toLocaleDateString('id-ID'):'-'}</div>`;
}
function hist(m,adm){
  if(!m.trx.length)return '<div class="mu">Belum ada setoran.</div>';
  return [...m.trx].sort((a,b)=>b.d.localeCompare(a.d)).map(t=>`<div class="it"><div><b style="color:${t.j<0?'var(--rd)':'var(--pr)'}">${t.j<0?'Debit − ':'Kredit + '}${rp(Math.abs(t.j))}</b><div class="mu">${fd(t.d)}${t.n?' · '+esc(t.n):''}</div></div>${adm?`<button class="d" onclick="delT('${m.id}','${t.id}')">Hapus</button>`:''}</div>`).join('');
}

function renderA(a){
  const tot=S.members.reduce((s,m)=>s+saldo(m),0);
  const opts=S.members.map(m=>`<option value="${m.id}" ${sel==m.id?'selected':''}>${esc(m.nama)}</option>`).join('');
  const sm=S.members.find(x=>x.id==sel);
  a.innerHTML=`<div class="card"><div class="row" style="align-items:center"><div><h1>ADMIN QURBAN SUNNAH</h1><div class="mu">${S.members.length} peserta · total ${rp(tot)}</div><div class="mu">🕒 Terakhir diperbarui: ${S.updated?new Date(S.updated).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'}):'-'}</div></div><button class="s" style="flex:0" onclick="out()">Keluar</button></div>
  ${dirty()?'<div class="err" style="margin-top:8px">⚠ Data tersimpan di HP ini. Setelah selesai: Cadangkan, lalu Buat File Peserta.</div>':''}
  <div class="row" style="margin-top:8px"><button onclick="$('#xf').click()">📥 Impor Excel</button><button class="s" onclick="pdfRekap()">📄 PDF Rekap</button></div><div class="row" style="margin-top:8px"><button onclick="pubOnline()">☁ Terbitkan ke Peserta</button><button class="s" onclick="bak()">💾 Cadangkan</button><button class="s" onclick="$('#rf').click()">♻ Pulihkan</button></div><input id="rf" type="file" hidden onchange="rest(this.files[0])"><div class="row" style="margin-top:8px"><button class="s" onclick="fromPeserta()">⬇ Ambil Data Online</button><button class="s" onclick="mkPeserta()">📤 File Peserta</button></div>
  <input id="xf" type="file" hidden onchange="imp(this.files[0])">
  <div class="mu" style="margin-top:6px">Excel: format tabungan (2 baris per peserta) atau kolom <b>Nama, HP, Target, Saldo</b>. ${esc(msg)}</div></div>
  <div class="card"><h2>Input Pemasukan</h2>
  <select id="ps"><option value="">— Pilih peserta —</option>${opts}</select>
  <div class="row"><input id="tg" type="date" value="${today()}"><input id="jm" type="text" inputmode="numeric" placeholder="Jumlah (Rp)" oninput="fmtJm(this)" autocomplete="off"></div>
  <select id="jn"><option value="1">Kredit (uang masuk)</option><option value="-1">Debit (uang keluar/penarikan)</option></select><input id="ct" placeholder="Catatan (opsional)"><button onclick="addT()">Simpan Transaksi</button></div>
  <div class="card"><h2>Peserta</h2>
  ${S.members.map(m=>`<div class="it" style="align-items:flex-start"><div style="flex:1"><b>${esc(m.nama)}</b><div class="mu">${rp(saldo(m))}${m.target?' / '+rp(m.target):''}</div><div class="bar"><i style="width:${pct(m)}%"></i></div></div><button class="s" onclick="sel='${m.id}';render();scrollTo(0,document.body.scrollHeight)">Detail</button></div>`).join('')||'<div class="mu">Belum ada peserta. Impor Excel atau tambah manual.</div>'}
  <div class="row" style="margin-top:8px"><input id="nn" placeholder="Nama peserta baru"><input id="nt" type="text" inputmode="numeric" placeholder="Target (Rp)" oninput="fmtJm(this)" autocomplete="off"></div><button class="s" onclick="addM()">+ Tambah Peserta</button></div>
  ${sm?`<div class="card"><h2>${esc(sm.nama)} — ${rp(saldo(sm))}</h2>${hist(sm,true)}
  <div class="row" style="margin-top:8px"><button onclick="pdfM('${sm.id}',false)">📄 PDF</button><button onclick="pdfM('${sm.id}',true)">💬 Kirim WA</button><button class="s" onclick="sel=null;render()">Tutup</button></div>
  <input id="hp" value="${esc(sm.hp||'')}" placeholder="No. HP (08...)" onchange="setHp('${sm.id}',this.value)" style="margin-top:8px"></div>`:''}
  <div class="card"><h2>Pengaturan</h2><input id="np" placeholder="PIN baru"><button class="s" onclick="if($('#np').value){S.pin=$('#np').value;save();msg='PIN diganti';render()}">Ganti PIN</button><h2 style="margin-top:14px">Terbitkan Otomatis (GitHub)</h2><div class="mu">${ghTok()?'Token tersimpan di HP ini ✔':'Belum ada token.'}</div><input id="tk" type="password" placeholder="Tempel token GitHub"><div class="row"><button class="s" onclick="saveTok()">Simpan Token</button><button class="d" onclick="delTok()">Hapus Token</button></div></div>`;
}
function fmtJm(el){const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');el.value=d.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function addT(){const id=$('#ps').value,j=Math.abs(+$('#jm').value.replace(/\D/g,''))*(+$('#jn').value||1);if(!id||!j){msg='Pilih peserta & isi jumlah';return render()}
  S.members.find(m=>m.id==id).trx.push({id:uid(),d:$('#tg').value||today(),j,n:$('#ct').value.trim()});sel=id;msg='Tersimpan ✔';save();render()}
function delT(m,t){if(!confirm('Hapus setoran ini?'))return;const x=S.members.find(a=>a.id==m);x.trx=x.trx.filter(a=>a.id!=t);save();render()}
function addM(){const n=$('#nn').value.trim();if(!n)return;S.members.push({id:uid(),nama:n,hp:'',target:+$('#nt').value.replace(/\D/g,'')||0,trx:[]});save();render()}
function setHp(id,v){S.members.find(m=>m.id==id).hp=v.trim();save()}
const str=v=>String(v==null?'':v).trim();
function parseLayout(A,hdr){
  const iso=s=>new Date(Math.round((s-25569)*864e5)).toISOString().slice(0,10);
  const list=[];
  for(let i=hdr+1;i<A.length;i++){const r=A[i],nama=str(r[1]);if(typeof r[0]!='number'||!nama)continue;
    const b=A[i+1]||[],trx=[],sa=+b[2]||0;
    if(sa>0)trx.push({id:uid(),d:'2026-06-01',j:sa,n:'Saldo awal (Dana 2025/2026)'});
    for(let c=3;c<=14;c++){const d=r[c],x=+b[c]||0;if(typeof d=='number'&&x)trx.push({id:uid(),d:iso(d),j:x,n:''})}
    list.push({nama,trx})}
  return list}
async function imp(f){if(!f)return;
  try{if(typeof XLSX=='undefined'){msg='Pustaka Excel belum termuat. Periksa internet lalu muat ulang.';return render()}
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    const hdr=A.findIndex(r=>r.some(c=>/nama\s*anggota/i.test(str(c))));
    if(hdr>=0){const list=parseLayout(A,hdr);
      if(!list.length){msg='Tidak ada peserta terbaca di Excel.';return render()}
      if(!confirm('Ditemukan '+list.length+' peserta. Transaksi peserta ini akan DIGANTI sesuai Excel. Lanjutkan?'))return;
      let n=0,u=0;
      list.forEach(x=>{const m=S.members.find(y=>y.nama.trim().toLowerCase()==x.nama.toLowerCase());
        if(m){m.trx=x.trx;u++}else{S.members.push({id:uid(),nama:x.nama,hp:'',target:0,trx:x.trx});n++}});
      msg='Impor: '+n+' baru, '+u+' diperbarui.';save();return render()}
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    const g=(r,k)=>{for(const c in r)if(c.trim().toLowerCase()==k)return r[c];return ''};
    let n=0,u=0;
    rows.forEach(r=>{const nama=str(g(r,'nama'));if(!nama)return;
      const hp=str(g(r,'hp')||g(r,'no hp')||g(r,'wa')),tg=+String(g(r,'target')).replace(/\D/g,'')||0,sa=+String(g(r,'saldo')).replace(/\D/g,'')||0;
      let m=S.members.find(x=>x.nama.trim().toLowerCase()==nama.toLowerCase());
      if(m){if(hp)m.hp=hp;if(tg)m.target=tg;u++}
      else{m={id:uid(),nama,hp,target:tg,trx:[]};if(sa>0)m.trx.push({id:uid(),d:today(),j:sa,n:'Saldo awal'});S.members.push(m);n++}});
    msg='Impor: '+n+' baru, '+u+' diperbarui.';save();render()}catch(e){msg='Gagal membaca file Excel: '+(e&&e.message||e);render()}}

const PUB='https://sayed231181.github.io/qurban/';
const GH={o:'Sayed231181',r:'qurban',p:'data.json'};
const ghTok=()=>{try{return localStorage.getItem('qurban-gh')||''}catch(e){return ''}};
const persist=()=>{try{localStorage.setItem('qurban-draft',JSON.stringify(S))}catch(e){}};
function saveTok(){const v=$('#tk').value.trim();if(!v)return;try{localStorage.setItem('qurban-gh',v)}catch(e){}msg='Token disimpan di HP ini.';render()}
function delTok(){try{localStorage.removeItem('qurban-gh')}catch(e){}msg='Token dihapus.';render()}
const pubData=()=>({updated:S.updated,members:S.members.map(m=>({id:m.id,nama:m.nama,target:m.target,trx:m.trx}))});
async function pubOnline(){
  const t=ghTok();if(!t){msg='Isi token GitHub dulu di bagian Pengaturan (paling bawah).';return render()}
  if(!S.members.length){msg='Belum ada data untuk diterbitkan.';return render()}
  const api='https://api.github.com/repos/'+GH.o+'/'+GH.r+'/contents/'+GH.p;
  const H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};
  try{msg='Menerbitkan...';render();
    let sha,remote=null;
    const g=await fetch(api+'?t='+Date.now(),{headers:H,cache:'no-store'});
    if(g.ok){const j=await g.json();sha=j.sha;try{remote=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}catch(e){}}
    else if(g.status==401||g.status==403){msg='Token ditolak: salah, kedaluwarsa, atau tanpa izin Contents.';return render()}
    else if(g.status!=404){msg='Gagal terhubung ke GitHub ('+g.status+').';return render()}
    if(remote&&remote.members&&remote.members.length&&(remote.updated||0)>(S.syncBase||0)){
      if(!confirm('Data online lebih baru dari yang terakhir Anda ambil. Timpa dengan data di HP ini?')){msg='Dibatalkan. Tekan Ambil Data Online dulu.';return render()}}
    const body=JSON.stringify(pubData());
    const p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'Update data qurban',content:btoa(unescape(encodeURIComponent(body))),sha})});
    if(!p.ok){msg='Gagal menerbitkan ('+p.status+').';return render()}
    S.syncBase=S.updated;persist();msg='Terbit ✔ Peserta akan melihat data baru dalam 1 sampai 3 menit.';render()
  }catch(e){msg='Gagal terhubung. Periksa internet.';render()}}
async function fromPeserta(){try{let d=null;
  try{const r=await fetch(PUB+'data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}
  if(!d||!Array.isArray(d.members)){const t=await (await fetch(PUB+'index.html',{cache:'no-store'})).text();
    const m=t.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);if(!m)throw 0;d=JSON.parse(m[1])}
  if(!Array.isArray(d.members)||!d.members.length)throw 0;
  if(S.members.length&&!confirm('Data di HP ini akan diganti dengan data online. Lanjutkan?'))return;
  S.members=d.members.map(x=>{const o=S.members.find(y=>y.id==x.id);return{id:x.id,nama:x.nama,hp:o?o.hp:'',target:x.target||0,trx:x.trx||[]}});
  S.updated=d.updated||Date.now();S.syncBase=S.updated;persist();msg='Data online dimuat ('+S.members.length+' peserta).';render()}catch(e){msg='Gagal mengambil data online.';render()}}
async function dlFile(name,data,type){const b=new Blob([data],{type});
  try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:b});return}}catch(e){if(e&&e.code=='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function bak(){dlFile('Cadangan-Qurban-'+today()+'.json',JSON.stringify(S),'application/json');msg='Cadangan diunduh. Simpan di tempat aman, jangan dibagikan.';render()}
async function rest(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.members))throw 0;if(!confirm('Ganti semua data dengan cadangan ini?'))return;S=d;save();msg='Data dipulihkan.';render()}catch(e){msg='File cadangan tidak valid.';render()}}
const PT=JSON.parse($('#pt').textContent);
function mkPeserta(){const j=JSON.stringify({updated:S.updated,members:S.members.map(m=>({id:m.id,nama:m.nama,target:m.target,trx:m.trx}))}).replace(/</g,'\\u003c');
  const html=PT.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,(x,a,b)=>a+j+b);
  dlFile('index.html',html,'text/html');msg='File peserta diunduh (index.html). Unggah ke GitHub peserta.';render()}

function wa(text,hp){let p=String(hp||'').replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank')}
async function dl(doc,fn){const blob=doc.output('blob');
  try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data:blob});return}}catch(e){if(e&&e.code=='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
async function share(doc,fn,text,hp){
  const f=new File([doc.output('blob')],fn,{type:'application/pdf'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return}}catch(e){if(e.name=='AbortError')return}
  await dl(doc,fn);wa(text+'\n(PDF terlampir, mohon lampirkan file yang tersimpan)',hp)}
function pdfM(id,sh){const m=S.members.find(x=>x.id==id);const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(16);doc.text('Laporan Tabungan Qurban Sunnah',14,18);doc.setFontSize(11);
  doc.text('Nama: '+m.nama,14,28);doc.text('Target: '+rp(m.target),14,35);doc.text('Saldo: '+rp(saldo(m)),14,42);doc.text('Per tanggal: '+fd(today()),14,49);
  const rows=[...m.trx].sort((a,b)=>a.d.localeCompare(b.d)).map((t,i)=>[i+1,fd(t.d),t.j<0?'':rp(t.j),t.j<0?rp(-t.j):'',t.n||'']);
  doc.autoTable({startY:56,head:[['No','Tanggal','Kredit','Debit','Catatan']],body:rows,foot:[['','Saldo Akhir',rp(saldo(m)),'','']],headStyles:{fillColor:[31,122,77]},footStyles:{fillColor:[227,242,234],textColor:20}});
  const fn='Qurban-'+m.nama.replace(/\W+/g,'_')+'.pdf';
  const txt=`Assalamualaikum ${m.nama}, saldo Tabungan Qurban Sunnah Anda per ${fd(today())}: ${rp(saldo(m))}`+(m.target?` (target ${rp(m.target)}, ${pct(m).toFixed(0)}%)`:'')+'. Jazakumullah khairan.';
  sh?share(doc,fn,txt,m.hp):dl(doc,fn)}
function pdfRekap(){const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(16);doc.text('Rekap Tabungan Qurban Sunnah',14,18);doc.setFontSize(10);doc.text('Per tanggal: '+fd(today()),14,25);
  const rows=S.members.map((m,i)=>[i+1,m.nama,rp(m.target),rp(saldo(m)),pct(m).toFixed(0)+'%']);
  doc.autoTable({startY:30,head:[['No','Nama','Target','Saldo','%']],body:rows,foot:[['','Total','',rp(S.members.reduce((s,m)=>s+saldo(m),0)),'']],headStyles:{fillColor:[31,122,77]},footStyles:{fillColor:[227,242,234],textColor:20}});
  dl(doc,'Rekap-Qurban.pdf')}
render();
